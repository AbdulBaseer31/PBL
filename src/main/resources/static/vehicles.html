<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>VRS - Explore Vehicles</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="bg-[#f6f6f4] min-h-screen text-gray-800 antialiased py-6 px-4 md:px-8 font-sans">
  <main class="max-w-4xl mx-auto flex flex-col gap-5">
    <header class="flex justify-between items-center pt-2 pb-1 border-b border-gray-200">
      <div>
        <h1 class="text-2xl md:text-[1.7rem] font-black tracking-tight text-gray-900 uppercase">
          VEHICLE CATALOG
        </h1>
        <p class="text-xs md:text-sm text-gray-500 font-medium mt-0.5">Browse and reserve vehicles</p>
      </div>
      <div class="flex items-center gap-3 text-xs">
        <a href="vehicles.html" class="text-[#3d6db5] font-semibold underline">Vehicles</a>
        <a href="booking.html" class="text-gray-600 hover:underline">My Bookings</a>
        <a href="bill.html" class="text-gray-600 hover:underline">My Bills</a>
        <a href="admin.html" id="nav-admin-link" class="hidden text-amber-600 font-semibold hover:underline">Admin</a>
        <span class="font-medium text-gray-700" id="nav-user-name"></span>
        <button onclick="logout()" class="text-red-600 hover:underline font-medium">Logout</button>
      </div>
    </header>

    <div id="catalog-error" class="hidden bg-red-50 text-red-700 text-xs p-3 rounded-lg border border-red-200"></div>

    <!-- Filter Card -->
    <section class="bg-white rounded-2xl p-4 shadow-sm border border-gray-200">
      <form id="filter-form" class="grid grid-cols-1 sm:grid-cols-4 gap-3 items-end">
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Type</label>
          <select id="filter-type" class="system-input w-full">
            <option value="">All Types</option>
            <option value="Sedan">Sedan</option>
            <option value="SUV">SUV</option>
            <option value="Hatchback">Hatchback</option>
            <option value="Bike">Bike</option>
            <option value="Scooter">Scooter</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Brand / Make</label>
          <select id="filter-brand" class="system-input w-full">
            <option value="">All Brands</option>
            <option value="Toyota">Toyota</option>
            <option value="Honda">Honda</option>
            <option value="Hyundai">Hyundai</option>
            <option value="Ford">Ford</option>
            <option value="BMW">BMW</option>
            <option value="Mercedes">Mercedes</option>
            <option value="Audi">Audi</option>
            <option value="Tata">Tata</option>
            <option value="Mahindra">Mahindra</option>
            <option value="Kia">Kia</option>
            <option value="Skoda">Skoda</option>
            <option value="Tesla">Tesla</option>
            <option value="Volkswagen">Volkswagen</option>
            <option value="Maruti">Maruti Suzuki</option>
            <option value="Royal Enfield">Royal Enfield</option>
            <option value="Yamaha">Yamaha</option>
            <option value="KTM">KTM</option>
            <option value="Bajaj">Bajaj</option>
            <option value="Hero">Hero</option>
            <option value="TVS">TVS</option>
            <option value="Vespa">Vespa</option>
            <option value="Ather">Ather</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Max Price ($/day)</label>
          <select id="filter-price" class="system-input w-full">
            <option value="">Any Price</option>
            <option value="50">Up to $50/day</option>
            <option value="100">Up to $100/day</option>
            <option value="150">Up to $150/day</option>
            <option value="200">Up to $200/day</option>
            <option value="250">Up to $250/day</option>
            <option value="300">Up to $300/day</option>
            <option value="350">Up to $350/day</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Sort By</label>
          <select id="filter-sort" class="system-input w-full">
            <option value="random">Randomized</option>
            <option value="alpha">Alphabetical (A - Z)</option>
            <option value="year_desc">Year (Newest First)</option>
            <option value="year_asc">Year (Oldest First)</option>
            <option value="price_asc">Price (Low to High)</option>
            <option value="price_desc">Price (High to Low)</option>
          </select>
        </div>
      </form>
      <div class="flex items-center justify-between mt-3 pt-3 border-t border-gray-100">
        <label class="flex items-center gap-1.5 text-xs text-gray-700 cursor-pointer">
          <input id="filter-available" type="checkbox" class="rounded text-[#3d6db5]"/>
          <span>Available vehicles only</span>
        </label>
        <button type="submit" form="filter-form" class="bg-[#3d6db5] hover:bg-[#325a96] text-white text-xs font-medium px-5 py-2 rounded-lg transition-colors">
          Search & Sort
        </button>
      </div>
    </section>

    <!-- Vehicle Grid -->
    <div id="vehicles-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      <p class="text-gray-500 italic col-span-3 text-center py-6">Loading vehicles...</p>
    </div>
  </main>

  <!-- Quick Book Modal -->
  <div id="book-modal" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-lg border border-gray-200">
      <h3 class="text-base font-bold text-gray-900" id="modal-vehicle-title">Reserve Vehicle</h3>
      <div id="modal-error" class="hidden bg-red-50 text-red-700 text-xs p-2 rounded border border-red-200"></div>
      <form id="modal-form" class="space-y-3">
        <input type="hidden" id="modal-plate"/>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Start Date</label>
          <input type="date" id="modal-date" class="system-input w-full" required/>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-700 mb-1">Days (1 - 30)</label>
          <input type="number" min="1" max="30" value="3" id="modal-days" class="system-input w-full" required/>
        </div>
        <div class="flex justify-end gap-2 pt-2">
          <button type="button" onclick="closeModal()" class="px-3 py-1.5 text-xs text-gray-600 hover:bg-gray-100 rounded-lg">Cancel</button>
          <button type="submit" class="bg-[#45856b] hover:bg-[#396f59] text-white text-xs font-medium px-4 py-1.5 rounded-lg">Confirm</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script>
    requireLogin();
    setupNavbar('vehicles');

    async function loadVehicles() {
      const type = document.getElementById('filter-type').value;
      const brand = document.getElementById('filter-brand').value.trim();
      const maxPrice = document.getElementById('filter-price').value;
      const sortBy = document.getElementById('filter-sort').value;
      const availableOnly = document.getElementById('filter-available').checked;

      const params = new URLSearchParams();
      if (type) params.append('type', type);
      if (brand) params.append('brand', brand);
      if (maxPrice) params.append('maxPrice', maxPrice);
      if (sortBy) params.append('sortBy', sortBy);
      if (availableOnly) params.append('availableOnly', 'true');

      const grid = document.getElementById('vehicles-grid');
      clearError('catalog-error');

      try {
        const vehicles = await apiFetch('/vehicles?' + params.toString());
        grid.innerHTML = '';
        if (!vehicles || vehicles.length === 0) {
          grid.innerHTML = '<p class="text-gray-500 italic col-span-3 text-center py-6">No matching vehicles found.</p>';
          return;
        }
        vehicles.forEach(v => {
          const card = document.createElement('div');
          card.className = 'bg-white rounded-2xl p-4 shadow-sm border border-gray-200 flex flex-col justify-between';
          card.innerHTML = `
            <div>
              <div class="flex justify-between items-start">
                <h3 class="font-bold text-gray-900">${v.brand}</h3>
                <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-gray-600 font-medium">${v.type}</span>
              </div>
              <p class="text-xs text-gray-500 mt-1">Plate: ${v.numberplate}</p>
              <p class="text-lg font-black text-gray-900 mt-3">$${v.basePrice}<span class="text-xs font-normal text-gray-500"> / day</span></p>
            </div>
            <button onclick="openModal('${v.numberplate}', '${v.brand}')" class="mt-4 w-full bg-[#45856b] hover:bg-[#396f59] text-white text-xs font-medium py-2 rounded-lg transition-colors">
              Reserve Now
            </button>
          `;
          grid.appendChild(card);
        });
      } catch (err) {
        showError('catalog-error', err.message);
      }
    }

    function openModal(plate, brand) {
      document.getElementById('modal-plate').value = plate;
      document.getElementById('modal-vehicle-title').textContent = `Reserve ${brand} (${plate})`;
      const tomorrow = new Date();
      tomorrow.setDate(tomorrow.getDate() + 1);
      document.getElementById('modal-date').value = tomorrow.toISOString().split('T')[0];
      clearError('modal-error');
      document.getElementById('book-modal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('book-modal').classList.add('hidden');
    }

    document.getElementById('modal-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      clearError('modal-error');
      try {
        const body = {
          numberplate: document.getElementById('modal-plate').value,
          reservDate: document.getElementById('modal-date').value,
          reservPeriod: parseInt(document.getElementById('modal-days').value)
        };
        const res = await apiFetch('/reservations', {
          method: 'POST',
          body: JSON.stringify(body)
        });
        alert(`Reservation confirmed! ID: ${res.reservationId}`);
        closeModal();
        window.location.href = 'booking.html';
      } catch (err) {
        showError('modal-error', err.message);
      }
    });

    document.getElementById('filter-form').addEventListener('submit', (e) => {
      e.preventDefault();
      loadVehicles();
    });

    loadVehicles();
  </script>
</body>
</html>
